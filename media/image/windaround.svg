<?xml version="1.0" encoding="UTF-8"?>
<!-- Wind Around Buildings: wind streamlines over a skyline -->
<svg width="300" height="300" viewBox="0 0 79.375 79.375" xmlns="http://www.w3.org/2000/svg">
  <!-- wind lines with curled ends -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <path d="M 10 18 H 44 A 5.5 5.5 0 1 0 38.5 12.5"/>
    <path d="M 14 26 H 54 A 5.5 5.5 0 1 1 59.5 31.5"/>
    <path d="M 10 38 H 30"/>
  </g>
  <!-- building blocks -->
  <g fill="#ffffff">
    <rect x="22" y="42" width="9" height="24"/>
    <rect x="33" y="33" width="12" height="33"/>
    <rect x="47" y="46" width="9" height="20"/>
  </g>
  <!-- ground -->
  <path d="M 14 66 H 66" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
</svg>
