<?xml version="1.0" encoding="UTF-8"?>
<!-- QGIS ABM Sim: folded map with agent dots and motion trails -->
<svg width="300" height="300" viewBox="0 0 79.375 79.375" xmlns="http://www.w3.org/2000/svg">
  <!-- trifold map -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round">
    <path d="M 12 18 L 30.5 12.5 L 49 18 L 67.5 12.5 V 57 L 49 62.5 L 30.5 57 L 12 62.5 Z"/>
    <path d="M 30.5 12.5 V 57"/>
    <path d="M 49 18 V 62.5"/>
  </g>
  <!-- agents -->
  <g fill="#ffffff">
    <circle cx="22" cy="32" r="2.6"/>
    <circle cx="28" cy="44" r="2.6"/>
    <circle cx="40" cy="27" r="2.6"/>
    <circle cx="44" cy="40" r="2.6"/>
    <circle cx="56" cy="30" r="2.6"/>
    <circle cx="52" cy="48" r="2.6"/>
  </g>
  <!-- motion trails -->
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3">
    <path d="M 24.5 34.5 L 29.5 41.5"/>
    <path d="M 42 29.5 L 46.5 37"/>
  </g>
</svg>
