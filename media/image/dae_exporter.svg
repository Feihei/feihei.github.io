<?xml version="1.0" encoding="UTF-8"?>
<!-- Simple DAE Exporter: model file with an export arrow -->
<svg width="300" height="300" viewBox="0 0 79.375 79.375" xmlns="http://www.w3.org/2000/svg">
  <!-- file box -->
  <rect x="14" y="24" width="26" height="32" rx="2" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  <!-- mesh triangle inside -->
  <path d="M 20 50 L 27 36 L 34 50 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <!-- export arrow -->
  <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 40 40 H 62"/>
    <path d="M 55 33 L 63 40.5 L 55 48"/>
  </g>
</svg>
